version: "3.8"

# Production-Level ServiceExpress Docker Compose Architecture
networks:
  serviceexpress-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local

services:
  # Database Service: MongoDB with Persistent Volume
  mongodb:
    image: mongo:6.0
    container_name: serviceexpress-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=serviceexpress
    volumes:
      - mongo-data:/data/db
    networks:
      - serviceexpress-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serviceexpress-backend
    image: serviceexpress-backend:latest
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/serviceexpress
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_prod_2026}
    ports:
      - "5000:5000"
    networks:
      serviceexpress-net:
        aliases:
          - backend
          - backend_service
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Dedicated Admin Microservice
  admin-backend:
    build:
      context: ./admin-backend
      dockerfile: Dockerfile
    container_name: serviceexpress-admin-backend
    image: serviceexpress-admin-backend:latest
    restart: always
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/serviceexpress
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_prod_2026}
    ports:
      - "5001:5001"
    networks:
      serviceexpress-net:
        aliases:
          - admin_service
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Frontend Web Application (Nginx static build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serviceexpress-frontend
    image: serviceexpress-frontend:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - serviceexpress-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3