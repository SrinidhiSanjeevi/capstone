apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeease.fullname" . }}-metrics-exporter
  labels:
    app: metrics-exporter
spec:
  replicas: 1   # deliberately fixed — no HPA. This pod does no user traffic;
                # scaling it would only recreate the duplication problem.
  selector:
    matchLabels:
      app: metrics-exporter
  template:
    metadata:
      labels:
        app: metrics-exporter
    spec:
      serviceAccountName: {{ include "homeease.fullname" . }}-workload-sa
      containers:
        - name: metrics-exporter
          image: "acrhomeeasedev.azurecr.io/homeease-backend:{{ .Values.image.tag }}"
          command: ["node", "services/metricsExporterServer.js"]
          ports:
            - name: metrics
              containerPort: 9200
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-homeease-secrets
                  key: MONGO_URI
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /api/health, port: 9200 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 9200 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homeease.fullname" . }}-metrics-exporter
  labels:
    app: metrics-exporter
spec:
  selector:
    app: metrics-exporter
  ports:
    - name: metrics
      port: 9200
      targetPort: 9200