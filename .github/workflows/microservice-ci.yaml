name: HomeEase Microservice Build

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    env:
      ACR_NAME: acrhomeeasedev
      ACR_LOGIN_SERVER: acrhomeeasedev.azurecr.io
      IMAGE_NAME: acrhomeeasedev.azurecr.io/homeease-${{ inputs.service }}:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Azure OIDC Login
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          echo "Azure account:"
          az account show

          echo "Checking resource group:"
          az group show --name rg-homeease-dev

      # ============================================================
      # ACR
      # ============================================================

      - name: Login to ACR
        run: |
          az acr login --name "$ACR_NAME"

      # ============================================================
      # Docker
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Dependency verification
      # ============================================================

      - name: Verify backend dependencies
        if: inputs.service == 'backend'
        working-directory: backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Verify admin-backend dependencies
        if: inputs.service == 'admin-backend'
        working-directory: admin-backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Verify frontend dependencies
        if: inputs.service == 'frontend'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      # ============================================================
      # Build
      # ============================================================

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t "$IMAGE_NAME" \
            "./${{ inputs.service }}"

      # ============================================================
      # Security Scan
      # ============================================================

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1

      # ============================================================
      # Push
      # ============================================================

      - name: Push Docker image to ACR
        run: |
          docker push "$IMAGE_NAME"