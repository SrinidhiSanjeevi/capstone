name: HomeEase Microservice Build

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # BUILD / SCAN / PUSH
  # ============================================================

  build-scan-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: acrhomeeasedev
      ACR_LOGIN_SERVER: acrhomeeasedev.azurecr.io
      IMAGE_NAME: acrhomeeasedev.azurecr.io/homeease-${{ inputs.service }}:${{ github.sha }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AZURE OIDC LOGIN
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange


      # ============================================================
      # VERIFY AZURE LOGIN
      # ============================================================

      - name: Verify Azure Login
        run: |

          echo "=========================================="
          echo "Azure login successful"
          echo "=========================================="

          az account show \
            --query "{subscription:name,id:id,tenantId:tenantId}" \
            -o table

          echo ""
          echo "Checking HomeEase resource group..."

          az group show \
            --name rg-homeease-dev \
            --query "{name:name,location:location}" \
            -o table


      # ============================================================
      # LOGIN TO ACR
      # ============================================================

      - name: Login to Azure Container Registry
        run: |

          echo "=========================================="
          echo "Logging into Azure Container Registry"
          echo "=========================================="

          az acr login --name "$ACR_NAME"

          echo "ACR login successful"


      # ============================================================
      # DOCKER BUILDX
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # BACKEND DEPENDENCIES
      # ============================================================

      - name: Verify backend dependencies
        if: inputs.service == 'backend'
        working-directory: backend
        run: |

          echo "Installing backend production dependencies..."

          npm ci --omit=dev --no-audit --no-fund

          echo "Running backend production dependency audit..."

          npm audit \
            --omit=dev \
            --audit-level=high


      # ============================================================
      # ADMIN BACKEND DEPENDENCIES
      # ============================================================

      - name: Verify admin-backend dependencies
        if: inputs.service == 'admin-backend'
        working-directory: admin-backend
        run: |

          echo "Installing admin-backend production dependencies..."

          npm ci --omit=dev --no-audit --no-fund

          echo "Running admin-backend production dependency audit..."

          npm audit \
            --omit=dev \
            --audit-level=high


      # ============================================================
      # FRONTEND DEPENDENCIES
      # ============================================================

      - name: Verify frontend dependencies
        if: inputs.service == 'frontend'
        working-directory: frontend
        run: |

          echo "Installing frontend dependencies..."

          # Vite/React build tools are required for npm run build.
          # Therefore devDependencies must be installed here.
          npm ci --no-audit --no-fund

          echo "Running frontend production dependency audit..."

          # Do not fail CI because of build-time devDependencies
          # such as Vite/esbuild/postcss.
          npm audit \
            --omit=dev \
            --audit-level=high


      # ============================================================
      # BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker image
        run: |

          echo "=========================================="
          echo "Building HomeEase service"
          echo "=========================================="

          echo "Service:"
          echo "${{ inputs.service }}"

          echo ""
          echo "Docker image:"
          echo "$IMAGE_NAME"

          echo "=========================================="

          docker build \
            --no-cache \
            -t "$IMAGE_NAME" \
            "./${{ inputs.service }}"


      # ============================================================
      # TRIVY SECURITY SCAN
      # ============================================================

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1


      # ============================================================
      # PUSH IMAGE TO ACR
      # ============================================================

      - name: Push Docker image to ACR
        run: |

          echo "=========================================="
          echo "Pushing Docker image to Azure Container Registry"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE_NAME"

          docker push "$IMAGE_NAME"

          echo ""
          echo "=========================================="
          echo "Successfully pushed:"
          echo "$IMAGE_NAME"
          echo "=========================================="