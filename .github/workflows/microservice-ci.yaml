name: HomeEase Microservice Build

on:
  workflow_call:

    inputs:
      service:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  id-token: write

jobs:

  build-scan-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: acrhomeeasedev
      ACR_LOGIN_SERVER: acrhomeeasedev.azurecr.io
      IMAGE_NAME: acrhomeeasedev.azurecr.io/homeease-${{ inputs.service }}:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Validate Azure secret format
        shell: bash
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |

          echo "Subscription length: ${#SUBSCRIPTION_ID}"
          echo "Tenant length: ${#TENANT_ID}"
          echo "Client length: ${#CLIENT_ID}"

          if [[ "$SUBSCRIPTION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Subscription ID format is valid."
          else
            echo "ERROR: AZURE_SUBSCRIPTION_ID contains extra characters."
            exit 1
          fi


      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange


      - name: Verify Azure Login
        run: |

          echo "=========================================="
          echo "Azure login successful"
          echo "=========================================="

          az account show \
            --query "{subscription:name,id:id,tenantId:tenantId}" \
            -o table

          echo ""
          echo "Checking HomeEase resource group..."

          az group show \
            --name rg-homeease-dev \
            --query "{name:name,location:location}" \
            -o table


      - name: Login to Azure Container Registry
        run: |

          echo "=========================================="
          echo "Logging into Azure Container Registry"
          echo "=========================================="

          az acr login --name "$ACR_NAME"

          echo "ACR login successful"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Verify backend dependencies
        if: inputs.service == 'backend'
        working-directory: backend
        run: |

          npm ci --omit=dev --no-audit --no-fund

          npm audit \
            --omit=dev \
            --audit-level=high


      - name: Verify admin-backend dependencies
        if: inputs.service == 'admin-backend'
        working-directory: admin-backend
        run: |

          npm ci --omit=dev --no-audit --no-fund

          npm audit \
            --omit=dev \
            --audit-level=high


      - name: Verify frontend dependencies
        if: inputs.service == 'frontend'
        working-directory: frontend
        run: |

          npm ci --no-audit --no-fund

          npm audit \
            --omit=dev \
            --audit-level=high


      - name: Build Docker image
        run: |

          echo "=========================================="
          echo "Building HomeEase service"
          echo "=========================================="

          echo "Service: ${{ inputs.service }}"
          echo "Image: $IMAGE_NAME"

          docker build \
            --no-cache \
            -t "$IMAGE_NAME" \
            "./${{ inputs.service }}"


      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1


      - name: Push Docker image to ACR
        run: |

          echo "=========================================="
          echo "Pushing Docker image to Azure Container Registry"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE_NAME"

          docker push "$IMAGE_NAME"

          echo ""
          echo "Successfully pushed:"
          echo "$IMAGE_NAME"