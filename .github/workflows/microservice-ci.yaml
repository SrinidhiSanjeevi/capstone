name: HomeEase Microservice Build

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    env:
      ACR_NAME: acrhomeeasedev
      ACR_LOGIN_SERVER: acrhomeeasedev.azurecr.io
      IMAGE_NAME: acrhomeeasedev.azurecr.io/homeease-${{ inputs.service }}:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify backend dependencies
        if: inputs.service == 'backend'
        working-directory: backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Verify admin-backend dependencies
        if: inputs.service == 'admin-backend'
        working-directory: admin-backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t "$IMAGE_NAME" \
            "./${{ inputs.service }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1

      - name: Push Docker image to ACR
        run: |
          docker push "$IMAGE_NAME"
