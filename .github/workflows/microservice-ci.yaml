name: HomeEase Microservice Build
//comment
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: acrhomeeasedev
      ACR_LOGIN_SERVER: acrhomeeasedev.azurecr.io
      IMAGE_NAME: acrhomeeasedev.azurecr.io/homeease-${{ inputs.service }}:${{ github.sha }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AZURE OIDC LOGIN
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange


      # ============================================================
      # VERIFY AZURE LOGIN
      # ============================================================

      - name: Verify Azure Login
        run: |
          echo "Azure login successful"

          az account show \
            --query "{subscription:name,id:id,tenantId:tenantId}" \
            -o table

          echo "Checking HomeEase resource group..."

          az group show \
            --name rg-homeease-dev \
            --query "{name:name,location:location}" \
            -o table


      # ============================================================
      # LOGIN TO ACR
      # ============================================================

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"


      # ============================================================
      # DOCKER BUILDX
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # BACKEND DEPENDENCIES
      # ============================================================

      - name: Verify backend dependencies
        if: inputs.service == 'backend'
        working-directory: backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high


      # ============================================================
      # ADMIN BACKEND DEPENDENCIES
      # ============================================================

      - name: Verify admin-backend dependencies
        if: inputs.service == 'admin-backend'
        working-directory: admin-backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high


      # ============================================================
      # FRONTEND DEPENDENCIES
      # ============================================================

      - name: Verify frontend dependencies
        if: inputs.service == 'frontend'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high


      # ============================================================
      # BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker image
        run: |
          echo "Building service:"
          echo "${{ inputs.service }}"

          echo "Docker image:"
          echo "$IMAGE_NAME"

          docker build \
            --no-cache \
            -t "$IMAGE_NAME" \
            "./${{ inputs.service }}"


      # ============================================================
      # TRIVY SECURITY SCAN
      # ============================================================

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1


      # ============================================================
      # PUSH IMAGE TO ACR
      # ============================================================

      - name: Push Docker image to ACR
        run: |
          echo "Pushing image:"
          echo "$IMAGE_NAME"

          docker push "$IMAGE_NAME"

          echo "Successfully pushed:"
          echo "$IMAGE_NAME"
