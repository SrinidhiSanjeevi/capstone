name: HomeEase Microservices CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "admin-backend/**"
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:

  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        shell: bash
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

          SERVICES="[]"

          if echo "$CHANGED_FILES" | grep -q '^backend/'; then
            SERVICES='["backend"]'
          fi

          if echo "$CHANGED_FILES" | grep -q '^admin-backend/'; then
            if [ "$SERVICES" = "[]" ]; then
              SERVICES='["admin-backend"]'
            else
              SERVICES=$(echo "$SERVICES" | sed 's/]$/, "admin-backend"]/')
            fi
          fi

          if echo "$CHANGED_FILES" | grep -q '^frontend/'; then
            if [ "$SERVICES" = "[]" ]; then
              SERVICES='["frontend"]'
            else
              SERVICES=$(echo "$SERVICES" | sed 's/]$/, "frontend"]/')
            fi
          fi

          echo "Detected services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/microservice-ci.yaml

    with:
      service: ${{ matrix.service }}

    secrets: inherit
