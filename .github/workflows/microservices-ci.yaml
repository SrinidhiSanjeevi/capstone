name: HomeEase Microservices CI

on:
  push:
    branches:
      - main

    paths:
      - "backend/**"
      - "admin-backend/**"
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:

  # ==============================================================
  # DETECT CHANGED SERVICES
  # ==============================================================

  detect-changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # DETECT CHANGED SERVICES
      # ------------------------------------------------------------

      - name: Detect changed services
        id: changed
        shell: bash
        run: |

          echo "Checking changed files..."

          CHANGED_FILES=$(git diff \
            --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}")

          echo ""
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          SERVICES="[]"


          # ========================================================
          # CI/CD WORKFLOW CHANGE
          # ========================================================
          # If the pipeline itself changes, test all services.
          # ========================================================

          if echo "$CHANGED_FILES" | grep -q '^\.github/workflows/'; then

            echo "CI/CD workflow changed."
            echo "Running pipeline for all services."

            SERVICES='["backend", "admin-backend", "frontend"]'

          else

            # ======================================================
            # BACKEND
            # ======================================================

            if echo "$CHANGED_FILES" | grep -q '^backend/'; then

              SERVICES='["backend"]'

            fi


            # ======================================================
            # ADMIN BACKEND
            # ======================================================

            if echo "$CHANGED_FILES" | grep -q '^admin-backend/'; then

              if [ "$SERVICES" = "[]" ]; then

                SERVICES='["admin-backend"]'

              else

                SERVICES=$(echo "$SERVICES" | \
                  sed 's/]$/, "admin-backend"]/')

              fi

            fi


            # ======================================================
            # FRONTEND
            # ======================================================

            if echo "$CHANGED_FILES" | grep -q '^frontend/'; then

              if [ "$SERVICES" = "[]" ]; then

                SERVICES='["frontend"]'

              else

                SERVICES=$(echo "$SERVICES" | \
                  sed 's/]$/, "frontend"]/')

              fi

            fi

          fi


          # ========================================================
          # OUTPUT
          # ========================================================

          echo ""
          echo "Detected services:"
          echo "$SERVICES"
          echo ""

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"


  # ==============================================================
  # BUILD / SCAN / PUSH
  # ==============================================================

  build-and-push:

    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/microservice-ci.yaml

    with:
      service: ${{ matrix.service }}

    secrets:

      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}